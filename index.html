<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <title>Portifólio</title>
</head>
<body onload="carregarDados(), carregarData(),carregarDuração()">
    <header>
        <nav id="menu"> 
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
                <button id="modoClaroEscuro">
                        <span class="material-icons">light_mode</span>
                </button>
            </ul>
        </nav>
    </header>
    <main id="home">
        
        <div id="hero"> 
             <img id="foto-perfil" src="https://avatars.githubusercontent.com/u/201268549?v=4" alt="Foto de perfil">
        
        <div id="dados">
            <h1 id="meuNome"></h1><br>
            <h2 id="tituloProfissional"></h2>

            <section id="habilidades">
                <h2>Minhas Habilidades</h2>
                <ul id="lista-habilidades"></ul>
            </section>
        </div>
    </div>

        <section id="secao-visitante">
            <h2 class="subtitulo">Quem está visitando?</h2>
            <p id="visitante-descricao">Deixa eu te receber como merece 👋</p>
                <div id="visitante-form">
                    <input type="text" id="inputNome" placeholder="Digite seu nome..." maxlength="50" autocomplete="off">
                    <button id="btnEnviar">
                        <span class="material-icons">send</span> Enviar
                    </button>
                </div>
                <div id="saudacao-visitante"></div>

                    <h2 class="subtitulo">Qual seu Pokémon favorito?</h2>
            <p id="visitante-descricao">Eu te mostro uma imagem dele.</p>
                <div id="visitante-form">
                    <input type="text" id="inputNomePoke" placeholder="Digite o nome do pokemon..." maxlength="50" autocomplete="off">
                    <button id="btnEnviarPoke">
                        <span class="material-icons">send</span> Enviar
                    </button>
                </div>
        <div id="mostrarPoke"></div>
        
        </section>

            
            <div id="secao-bio">
                <h2 class="subtitulo">Sobre mim</h2>
                <p id="minhaBio"></p>
            </div>

            <div id="secao-datas">
                <p id="anoFormatura1"></p>
                <p id="formatura1"></p>
                <p id="formatura2"></p>
                <p id="ingresso1"></p>
                <p id="ingresso2"></p>
                <p id="tempoRestanteFormaturas"></p>
            </div>

        <section id="quiz">
            <h2>Descubra seu perfil dev</h2>
            <p>Você prefere trabalhar com...</p>

        <div id="quiz-botoes">
            <button id="btn-visual">
                <span class="material-icons">palette</span> Visual e design
            </button>
            <button id="btn-logica">
                <span class="material-icons">settings</span> Lógica e dados
            </button>
        </div>

            <div id="resultado-quiz"></div>
        </section>

        <section id="secao-projetos">
            <h2 class="subtitulo">Meus Projetos</h2>
            <ul id="lista-projetos"></ul>
        </section>


    </main>

    <script src="scripts/script.js"></script>
    <script src="scripts/async.js"></script>
</body>
</html>
